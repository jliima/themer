// Themer live settings for Firefox (plugins/firefox). Firefox skips the first line of an autoconfig file.
//
// install.sh copies this file into the Firefox installation folder, next to defaults/pref/themer-autoconfig.js which
// loads it. It runs in every profile with chrome privileges. Every 2 seconds it checks
// $XDG_CACHE_HOME/themer/firefox/live.json (rendered by `themer apply`, target "Firefox live settings") and, when the
// file changed, applies it to the running Firefox:
//
//   "zoom": 1.2           default page zoom, as in Settings > Zoom; open tabs follow at once
//   "ui-scale": 1.2       set as --themer-ui-scale on every browser window, for sizes in userChrome.css
//   "prefs": {"a": 1}     preferences to set (string, integer or boolean values)
try {
  (() => {
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
    const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
    const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    file.initWithPath(env.get("XDG_CACHE_HOME") || env.get("HOME") + "/.cache");
    for (const part of ["themer", "firefox", "live.json"]) {
      file.append(part);
    }
    const ZOOM = "browser.content.full-zoom";
    let stamp = 0;
    let live = {};

    // In the Browser Console, and on stdout with browser.dom.window.dump.enabled.
    const log = (msg) => {
      Services.console.logStringMessage(`themer.cfg: ${msg}`);
      dump(`themer.cfg: ${msg}\n`);
    };

    function setPref(name, value) {
      const prefs = Services.prefs;
      if (typeof value === "boolean") {
        prefs.setBoolPref(name, value);
      } else if (Number.isInteger(value)) {
        prefs.setIntPref(name, value);
      } else {
        prefs.setStringPref(name, String(value));
      }
    }

    function setZoom(zoom) {
      const cps = Cc["@mozilla.org/content-pref/service;1"].getService(Ci.nsIContentPrefService2);
      const ctx = Cu.createLoadContext();
      if (zoom === 1) {
        cps.removeGlobal(ZOOM, ctx);
      } else {
        cps.setGlobal(ZOOM, zoom, ctx);
      }
    }

    function styleWindow(win) {
      win.document.documentElement.style.setProperty("--themer-ui-scale", String(live["ui-scale"] ?? 1));
    }

    function apply() {
      for (const [name, value] of Object.entries(live.prefs ?? {})) {
        try {
          setPref(name, value);
        } catch (e) {
          log(`pref ${name}: ${e}`);
        }
      }
      if (typeof live.zoom === "number" && live.zoom > 0) {
        try {
          setZoom(live.zoom);
        } catch (e) {
          log(`zoom: ${e}`);
        }
      }
      for (const win of Services.wm.getEnumerator("navigator:browser")) {
        styleWindow(win);
      }
    }

    // Reads live.json when its time stamp changed; returns true if there is something new to apply.
    function load() {
      if (!file.exists()) {
        return false;
      }
      const t = file.lastModifiedTime;
      if (t === stamp) {
        return false;
      }
      stamp = t;
      try {
        live = JSON.parse(Cu.readUTF8File(file));
        return true;
      } catch (e) {
        log(`${file.path}: ${e}`);
        return false;
      }
    }

    const tick = () => {
      try {
        if (load()) {
          apply();
        }
      } catch (e) {
        log(e);
      }
    };
    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);

    const observer = {
      observe(subject, topic) {
        if (topic === "final-ui-startup") {
          timer.initWithCallback({ notify: tick }, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
          tick();
        } else if (topic === "browser-delayed-startup-finished") {
          styleWindow(subject);
        } else if (topic === "quit-application") {
          timer.cancel();
        }
      },
    };
    for (const topic of ["final-ui-startup", "browser-delayed-startup-finished", "quit-application"]) {
      Services.obs.addObserver(observer, topic);
    }
    // Keeps the timer and observer alive for the whole session.
    globalThis.themerLive = { timer, observer };
  })();
} catch (e) {
  Components.utils.reportError(`themer.cfg: ${e}`);
}
