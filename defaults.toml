# Themer defaults. Every theme is layered over this file, so a theme only has to define what makes it different.
# Precedence for colors: theme [variant] > theme [roles] > defaults [variant] > defaults [roles].
# Other tables (fonts, shape, kde, konsole, firefox) merge key by key, the theme winning.

[fonts]
sans = "Noto Sans"
mono = "Hack"
ui-size = 10          # points; Plasma UI, menus, toolbars
small-size = 8        # points; smallest readable
mono-size = 11        # points; Konsole, Kate
title-size = 10       # points; window titles
ui-weight = 400       # 100 to 900; UI text in Plasma, menus, toolbars (also the GTK font Plasma passes on)
title-weight = 500    # window titles
mono-weight = 400     # Konsole, Kate

[shape]
radius-xs = 4
radius-sm = 6
radius-md = 10
radius-lg = 14

[kde]
widget-style = "Darkly"
# widget-style-dark = "kvantum-dark"   # optional: the widget style for dark variants (Kvantum loads <theme>Dark)
decoration-library = "org.kde.darkly"
decoration-theme = "Darkly"
buttons-left = ""
buttons-right = "IAX"   # I minimize, A maximize, X close
title-alignment = "AlignCenterFullWidth"

# Window frames drawn by the Themer KWin decoration (decoration/, see README). Sizes in logical px.
[window]
title-height = 34
title-size = 12          # px, window title; its weight is fonts.title-weight
button-size = 22         # round button ground
button-spacing = 6
glyph-size = 8           # minimize, maximize and close glyphs
glyph-stroke = 1.25
icon-size = 16           # window icon of the menu button (M in buttons-left)
padding-left = 12
padding-right = 8
outline-width = 1        # ring around inactive windows drawn by the rounded corners effect, 0 for none
outline-width-active = 1  # the same ring around the active window
decoration-outline-width = 1  # ring drawn by the decoration itself; 0 when the rounded corners effect draws it
resize-border = 6        # invisible resize area outside the window
shadow-blur = 64         # like CSS box-shadow: 0 <offset> <blur>
shadow-offset = 24
shadow-alpha-dark = 0.8
shadow-alpha-light = 0.2
hover-duration = 120     # ms

# Qt widgets drawn by the Themer Kvantum theme (kvantum.py, templates/kvantum). Sizes in px; radii come from [shape].
[kvantum]
menu-padding = 4         # menu items sit this far in from the menu edge
menu-separator = 9       # height of a menu separator row
scroll-width = 10
slider-width = 4         # groove thickness
slider-handle = 16
progress-thickness = 6
check-size = 16
arrow-size = 10
button-height = 32       # push buttons, combo boxes and line edits (min height)
row-height = 28          # menu items and list rows (min height)

[konsole]
margin = 12
line-spacing = 2

[firefox]
compact = true          # browser.uidensity 1

# Roles: what each color is for, as aliases of palette tokens.
[roles]
accent = "{blue}"
accent-hover = "{blue-bright}"
accent-soft = "{blue-soft}"
focus-ring = "{accent}"
link = "{accent}"
success = "{green}"
success-soft = "{green-soft}"
warning = "{orange}"
warning-soft = "{orange-soft}"
danger = "{red}"
danger-soft = "{red-soft}"
info = "{cyan}"
info-soft = "{cyan-soft}"
syntax-keyword = "{green}"
syntax-string = "{magenta}"
syntax-escape = "{cyan}"
syntax-number = "{red}"
syntax-constant = "{red}"
syntax-function = "{blue}"
syntax-class = "{blue-bright}"
syntax-type = "{cyan}"
syntax-annotation = "{violet}"
syntax-doc-tag = "{orange}"
syntax-property = "{cyan}"
syntax-tag = "{green}"
syntax-attribute = "{orange}"
syntax-variable = "{text}"
syntax-operator = "{text-muted}"
syntax-punctuation = "{text-subtle}"
syntax-comment = "{text-faint}"
syntax-heading = "{blue-bright}"
syntax-link = "{blue}"
syntax-url = "{cyan}"
syntax-regex = "{cyan}"
# KDE has one selection color for list rows, checkboxes and progress bars.
# "{accent}" with "{on-accent}" text gives vivid selections.
kde-selection = "{selection}"
kde-selection-text = "{text}"
# Window frames (Themer KWin decoration)
titlebar = "{bg-deep}"
titlebar-inactive = "{bg-deep}"
titlebar-text = "{text-subtle}"
titlebar-text-inactive = "{text-faint}"
titlebar-button-hover = "{surface-active}"
titlebar-button-pressed = "{surface-hover}"
titlebar-button-checked = "{accent-soft}"
titlebar-close-hover = "{danger}"
titlebar-close-pressed = "{red-bright}"
titlebar-close-text = "{on-accent}"
window-outline = "{focus-ring}"
window-outline-inactive = "{line}"

[dark]
window-shadow = "#000000"
on-accent = "{bg-deep}"
text-inverse = "{bg-deep}"
selection = "oklch(0.36 0.07 246)"
ansi-0 = "{surface-active}"
ansi-1 = "{red}"
ansi-2 = "{green}"
ansi-3 = "{yellow}"
ansi-4 = "{blue}"
ansi-5 = "{magenta}"
ansi-6 = "{cyan}"
ansi-7 = "{text-muted}"
ansi-8 = "{text-faint}"
ansi-9 = "{red-bright}"
ansi-10 = "{green-bright}"
ansi-11 = "{yellow-bright}"
ansi-12 = "{blue-bright}"
ansi-13 = "{magenta-bright}"
ansi-14 = "{cyan-bright}"
ansi-15 = "{text-bright}"

[light]
window-shadow = "#0b1620"
on-accent = "#ffffff"
text-inverse = "#ffffff"
selection = "oklch(0.87 0.05 246)"
ansi-0 = "{text-muted}"
ansi-1 = "{red}"
ansi-2 = "{green}"
ansi-3 = "{yellow}"
ansi-4 = "{blue}"
ansi-5 = "{magenta}"
ansi-6 = "{cyan}"
ansi-7 = "{line-strong}"
ansi-8 = "{text-subtle}"
ansi-9 = "{red-bright}"
ansi-10 = "{green-bright}"
ansi-11 = "{yellow-bright}"
ansi-12 = "{blue-bright}"
ansi-13 = "{magenta-bright}"
ansi-14 = "{cyan-bright}"
ansi-15 = "{line}"
