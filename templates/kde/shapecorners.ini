[Round-Corners]
Size={{ shape.radius-lg }}
InactiveCornerRadius={{ shape.radius-lg }}
UseSquircleShape=false
UseNativeDecorationShadows=true
OutlineThickness={{ window.outline-width-active }}
InactiveOutlineThickness={{ window.outline-width }}
OutlineColor={{ window-outline | rgb }}
InactiveOutlineColor={{ window-outline-inactive | rgb }}
ActiveOutlineAlpha=255
InactiveOutlineAlpha=255
ActiveOutlineUseCustom=true
InactiveOutlineUseCustom=true
ActiveOutlineUsePalette=false
InactiveOutlineUsePalette=false
SecondOutlineThickness=0
InactiveSecondOutlineThickness=0
OuterOutlineThickness=0
InactiveOuterOutlineThickness=0
