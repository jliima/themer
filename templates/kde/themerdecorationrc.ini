# Written by Themer for the Themer KWin decoration (themer/decoration). Colors are the titlebar-* and window-*
# roles, sizes the [window] table and shape.radius-lg.
[Colors]
TitleBar={{ titlebar | rgb }}
TitleBarInactive={{ titlebar-inactive | rgb }}
Title={{ titlebar-text | rgb }}
TitleInactive={{ titlebar-text-inactive | rgb }}
Glyph={{ titlebar-text | rgb }}
GlyphInactive={{ titlebar-text-inactive | rgb }}
GlyphHover={{ text | rgb }}
ButtonHover={{ titlebar-button-hover | rgb }}
ButtonPressed={{ titlebar-button-pressed | rgb }}
Checked={{ titlebar-button-checked | rgb }}
CloseHover={{ titlebar-close-hover | rgb }}
ClosePressed={{ titlebar-close-pressed | rgb }}
CloseGlyphHover={{ titlebar-close-text | rgb }}
Outline={{ window-outline | rgb }}
OutlineInactive={{ window-outline-inactive | rgb }}
Shadow={{ window-shadow | rgb }}
ShadowAlphaDark={{ window.shadow-alpha-dark }}
ShadowAlphaLight={{ window.shadow-alpha-light }}

[Metrics]
TitleHeight={{ window.title-height }}
TitleFontSize={{ window.title-size }}
TitleFontWeight={{ fonts.title-weight }}
PaddingLeft={{ window.padding-left }}
PaddingRight={{ window.padding-right }}
ButtonSize={{ window.button-size }}
ButtonSpacing={{ window.button-spacing }}
GlyphSize={{ window.glyph-size }}
GlyphStroke={{ window.glyph-stroke }}
IconSize={{ window.icon-size }}
HoverDuration={{ window.hover-duration }}
CornerRadius={{ shape.radius-lg }}
OutlineWidth={{ window.decoration-outline-width }}
ResizeBorder={{ window.resize-border }}
ShadowBlur={{ window.shadow-blur }}
ShadowOffset={{ window.shadow-offset }}
