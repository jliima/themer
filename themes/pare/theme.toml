green-bright = "#67efb1"
green-dim = "#007d53"
green-soft = "#002f1d"
# Cyan
cyan = "#2bc5c7"
cyan-bright = "#61dadb"
cyan-dim = "#00787a"
cyan-soft = "#002d2e"
# Blue
blue = "#5faff1"
