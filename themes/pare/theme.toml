# Pare: a Themer theme.
#
#   themer apply --theme pare             apply it (themer apply --theme pare:light for the light variant)
#   themer check --theme pare             contrast report
#   themer validate --theme pare          check it fills the token contract (contract.toml)
#
# Values: "#rrggbb", "oklch(L C H)" (L 0..1, C about 0..0.37, H degrees), or "{other-token}".
# Anything left out falls back to defaults.toml: roles, syntax colors, terminal colors, fonts, shapes.
# Each hue may also define -bright, -dim and -soft; leave them out and Themer derives them from the base hue.

[meta]
id = "pare"
name = "Pare"
description = "Cool blue-grey neutrals with tuned, readable accents. Dark first."
version = "1.0.0"
variants = ["dark", "light"]
default-variant = "dark"

[fonts]
sans = "SF Pro"
mono = "Liga SFMono Nerd Font"
ui-weight = 500            # from the design system's body style
title-weight = 600

[shape]
radius-xs = 4
radius-sm = 6
radius-md = 10
radius-lg = 14

# Roles: what each color is for. A variant table can override any of them.
[roles]
accent = "{blue}"
accent-hover = "{blue-bright}"
accent-soft = "{blue-soft}"
focus-ring = "{blue}"
link = "{blue}"
success = "{green}"
success-soft = "{green-soft}"
warning = "{orange}"
warning-soft = "{orange-soft}"
danger = "{red}"
danger-soft = "{red-soft}"
info = "{cyan}"
info-soft = "{cyan-soft}"
syntax-keyword = "{green}"
syntax-string = "{magenta}"
syntax-escape = "{cyan}"
syntax-number = "{red}"
syntax-constant = "{red}"
syntax-function = "{blue}"
syntax-class = "{blue-bright}"
syntax-type = "{cyan}"
syntax-annotation = "{violet}"
syntax-doc-tag = "{orange}"
syntax-property = "{cyan}"
syntax-tag = "{green}"
syntax-attribute = "{orange}"
syntax-variable = "{text}"
syntax-operator = "{text-muted}"
syntax-punctuation = "{text-subtle}"
syntax-comment = "{text-faint}"
syntax-heading = "{blue-bright}"
syntax-link = "{blue}"
syntax-url = "{cyan}"
syntax-regex = "{cyan}"

[dark]
# Grounds, deepest to highest
bg-deep = "#05090e"
bg-sunken = "#070c12"
bg = "#091017"
# Surfaces
surface = "#121a23"
surface-raised = "#19232c"
surface-hover = "#1e2933"
surface-active = "#28333e"
# Lines
line = "#222b35"
line-strong = "#5d6b79"
# Text, brightest last
text-bright = "#eaf1f8"
text = "#d1deeb"
text-muted = "#b0bcc8"
text-subtle = "#909daa"
text-faint = "#788898"
text-disabled = "#505c69"
text-inverse = "{bg-deep}"
# Red
red = "#f45959"
red-bright = "#ff7e79"
red-dim = "#ac403f"
red-soft = "#411716"
# Orange
