# Terminal colors 0 to 15
ansi-0 = "{surface-active}"
ansi-1 = "{red}"
ansi-2 = "{green}"
ansi-3 = "{yellow}"
ansi-4 = "{blue}"
ansi-5 = "{magenta}"
ansi-6 = "{cyan}"
ansi-7 = "{text-muted}"
ansi-8 = "{text-faint}"
ansi-9 = "{red-bright}"
ansi-10 = "{green-bright}"
ansi-11 = "{yellow-bright}"
ansi-12 = "{blue-bright}"
ansi-13 = "{magenta-bright}"
ansi-14 = "{cyan-bright}"
