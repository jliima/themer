# What `themer apply` writes, and where. Targets are the same for every theme.
#
# Each [[target]] has:
#   name      label shown in output
#   group     used by `themer apply --only kde,firefox`
#   template  file under templates/, looked up in ~/.config/themer/templates, then the theme's own templates/
#             folder, then templates/ next to this file (only the kde example is kept there). A target whose
#             template is not found is skipped with a note.
#   format    a built-in output: json, css, sh
#   output    destination; may use {{ tokens }} ({{ scheme }}, {{ variant }}, {{ theme }}) and {firefox}. A * ? or [..]
#             in it is matched against the folders that exist (every installed IDE version); no match, no file.
#   archive   true: template is a folder; every file in it is rendered and the output is a zip of them (a .jar too)
#   variants  "active" (default) renders the applied variant, "all" renders every variant the theme has
#   mode      "write" (default) replaces the file, "merge-ini" sets only the listed keys in a KDE config file,
#             "ensure-lines" adds or replaces single lines (user.js)
#   reload    built-in action (kde-colors, kwin, kde-style, gtk) or a shell command, run when the file changed
#   dotfiles  true: with [dotfiles] on in settings.toml, write the file into the dotfiles folder at the same path
#             relative to ~ and let stow link it. Use it for whole files Themer owns, not for merged ones.
#   enabled   false to skip
#
# Add your own: drop a template in ~/.config/themer/templates/ and add a [[target]] to
# ~/.config/themer/targets.toml. That file is read on top of this one: a target with the name of one here replaces
# it (add enabled = false to turn it off), any other name is added after these.

# ---- KDE Plasma ------------------------------------------------------------------------------------------------------

[[target]]
name = "Plasma color schemes"
dotfiles = true
group = "kde"
template = "kde/scheme.colors"
output = "~/.local/share/color-schemes/{{ scheme }}.colors"
variants = "all"
reload = "kde-colors"

[[target]]
name = "Fonts and widget style"
group = "kde"
template = "kde/kdeglobals.ini"
output = "~/.config/kdeglobals"
mode = "merge-ini"
reload = "kde-style"

[[target]]
name = "Darkly widget style and window decoration"
group = "kde"
template = "kde/darklyrc.ini"
output = "~/.config/darklyrc"
mode = "merge-ini"
reload = "kwin"

# Read by the Themer KWin decoration (decoration/). Harmless without it; to use it, build it and set
# [kde] decoration-library = "themer" in the theme or in settings.toml.
[[target]]
name = "Themer window decoration"
group = "kde"
template = "kde/themerdecorationrc.ini"
output = "~/.config/themerdecorationrc"
reload = "kwin"

# KDE-Rounded-Corners (kwin4_effect_shapecorners), if installed: rounds and outlines every window, including ones
# that draw their own title bar. Same radius and ring as the decoration.
[[target]]
name = "Rounded corners effect"
group = "kde"
template = "kde/shapecorners.ini"
output = "~/.config/kwinrc"
mode = "merge-ini"
reload = "kwin"

# Kvantum widget style: a theme folder with a light (Themer) and dark (ThemerDark) variant, drawn from tokens. Use it
# with [kde] widget-style = "kvantum" and widget-style-dark = "kvantum-dark" (in the theme or settings.toml).
[[target]]
name = "Kvantum theme"
dotfiles = true
group = "kde"
template = "kvantum/Themer.kvconfig"
output = "~/.config/Kvantum/Themer/Themer{{ dark-suffix }}.kvconfig"
variants = "all"

[[target]]
name = "Kvantum theme image"
dotfiles = true
group = "kde"
format = "kvantum-svg"
output = "~/.config/Kvantum/Themer/Themer{{ dark-suffix }}.svg"
variants = "all"

[[target]]
name = "Kvantum theme selection"
group = "kde"
template = "kvantum/kvantum.kvconfig"
output = "~/.config/Kvantum/kvantum.kvconfig"
mode = "merge-ini"

[[target]]
name = "Window buttons on the right"
group = "kde"
template = "kde/kwinrc.ini"
output = "~/.config/kwinrc"
mode = "merge-ini"
reload = "kwin"

# ---- Konsole ---------------------------------------------------------------------------------------------------------

[[target]]
name = "Konsole color schemes"
dotfiles = true
group = "konsole"
template = "konsole/scheme.colorscheme"
output = "~/.local/share/konsole/{{ scheme }}.colorscheme"
variants = "all"

[[target]]
name = "Konsole profile"
dotfiles = true
group = "konsole"
template = "konsole/Themer.profile"
output = "~/.local/share/konsole/Themer.profile"

[[target]]
name = "Konsole default profile"
group = "konsole"
template = "konsole/konsolerc.ini"
output = "~/.config/konsolerc"
mode = "merge-ini"

# ---- Editors ---------------------------------------------------------------------------------------------------------

[[target]]
name = "Kate, KWrite and KDevelop syntax theme"
dotfiles = true
group = "kate"
template = "kate/syntax.theme"
output = "~/.local/share/org.kde.syntax-highlighting/themes/Themer-{{ Variant }}.theme"
variants = "all"

[[target]]
name = "Kate uses the Themer syntax theme"
group = "kate"
template = "kate/katerc.ini"
output = "~/.config/katerc"
mode = "merge-ini"

# ---- GTK -------------------------------------------------------------------------------------------------------------

# Plasma already passes the color scheme to GTK apps (kde-gtk-config). themer.css refines libadwaita on top of it
# and is imported last from gtk.css, so a Plasma rewrite of gtk.css only needs another `themer apply`.
[[target]]
name = "GTK 4 and libadwaita colors"
dotfiles = true
group = "gtk"
template = "gtk/themer.css"
output = "~/.config/gtk-4.0/themer.css"
reload = "gtk"

[[target]]
name = "GTK 4 import"
group = "gtk"
template = "gtk/import.css"
output = "~/.config/gtk-4.0/gtk.css"
mode = "ensure-lines"

# ---- Firefox ---------------------------------------------------------------------------------------------------------

[[target]]
name = "Firefox colors"
group = "firefox"
format = "css"
output = "{firefox}/chrome/themer-colors.css"

[[target]]
name = "Firefox userChrome.css"
group = "firefox"
template = "firefox/userChrome.css"
output = "{firefox}/chrome/userChrome.css"

[[target]]
name = "Firefox userContent.css"
group = "firefox"
template = "firefox/userContent.css"
output = "{firefox}/chrome/userContent.css"

[[target]]
name = "Firefox prefs"
group = "firefox"
template = "firefox/user.js"
output = "{firefox}/user.js"
mode = "ensure-lines"

# Settings the Firefox plugin (plugins/firefox) applies to every profile while Firefox runs: default zoom, prefs and
# a UI scale for userChrome.css. Firefox picks up a change within a few seconds, no restart.
[[target]]
name = "Firefox live settings"
group = "firefox"
template = "firefox/live.json"
output = "~/.cache/themer/firefox/live.json"

# ---- JetBrains IDEs --------------------------------------------------------------------------------------------------

# Every installed IDE version gets the editor scheme "Themer" and a small theme plugin ("Themer", UI colors). A
# reload plugin (plugins/jetbrains, installed with its install.sh) restyles running IDEs live; jetbrains-themer-apply
# installs it and calls it. Without it an IDE shows a change after a restart.
[[target]]
name = "JetBrains editor scheme"
group = "jetbrains"
template = "jetbrains/themer.icls"
output = "~/.config/JetBrains/*20[0-9][0-9].[0-9]*/colors/Themer.icls"

[[target]]
name = "JetBrains UI theme plugin"
group = "jetbrains"
template = "jetbrains/plugin"
archive = true
output = "~/.local/share/JetBrains/*20[0-9][0-9].[0-9]*/themer/lib/themer-theme.jar"

# The same UI theme as plain JSON, which the reload plugin loads into a running IDE.
[[target]]
name = "JetBrains UI theme"
group = "jetbrains"
template = "jetbrains/plugin/theme/themer.theme.json"
output = "~/.cache/themer/jetbrains/themer.theme.json"
reload = "PATH=$HOME/.local/bin:$PATH; command -v jetbrains-themer-apply >/dev/null && jetbrains-themer-apply"

# Editor and UI fonts, which the reload plugin applies at IDE start and on every reload.
[[target]]
name = "JetBrains fonts"
group = "jetbrains"
template = "jetbrains/fonts.properties"
output = "~/.cache/themer/jetbrains/fonts.properties"
reload = "PATH=$HOME/.local/bin:$PATH; command -v jetbrains-themer-apply >/dev/null && jetbrains-themer-apply"

# ---- VS Code ---------------------------------------------------------------------------------------------------------

# The dark and light theme ("Themer Dark" and "Themer Light") of the Themer extension (plugins/vscode/install.sh), which
# reloads the window when a theme is re-rendered: VS Code reads a theme file only once. With
# window.autoDetectColorScheme VS Code follows the desktop mode, so a dark/light switch needs no reload at all.
[[target]]
name = "VS Code themes"
group = "vscode"
template = "vscode/theme.json"
output = "~/.vscode/extensions/themer.themer-*/themes/themer-{{ variant }}.json"
variants = "all"

# ---- Browser extensions ----------------------------------------------------------------------------------------------

# Read by the Themer native messaging host (plugins/browser), which pushes them to the Dark Reader and Stylus forks
# while the browser runs: open tabs restyle at once. tokens.json is the applied variant's tokens (Stylus turns them into
# the --themer-* CSS variables); darkreader.json is Dark Reader settings from your template: mode, colors, contrast, ...
[[target]]
name = "Browser extension tokens"
group = "browser"
format = "json"
output = "~/.cache/themer/browser/tokens.json"

[[target]]
name = "Dark Reader settings"
group = "browser"
template = "browser/darkreader.json"
output = "~/.cache/themer/browser/darkreader.json"

# ---- Exports for everything else -------------------------------------------------------------------------------------

[[target]]
name = "Tokens as JSON"
group = "exports"
format = "json"
output = "~/.cache/themer/colors.json"

[[target]]
name = "Tokens as CSS variables"
group = "exports"
format = "css"
output = "~/.cache/themer/colors.css"

[[target]]
name = "Tokens as shell variables"
group = "exports"
format = "sh"
output = "~/.cache/themer/colors.sh"
